version: "3.8"

services:
  # Site do Laboratório 1 - Camilo Feitosa
  laboratorio1:
    build:
      context: ./laboratorios
      dockerfile: Dockerfile.lab1
    container_name: lab1-site
    networks:
      - centro-network
    restart: unless-stopped
    volumes:
      - ./dados-centro:/dados-centro:ro # Acesso compartilhado aos dados do centro
    environment:
      - LAB_NAME=Laboratório 1

  # Site do Laboratório 2 - Davi ZzZS2
  laboratorio2:
    build:
      context: ./laboratorios
      dockerfile: Dockerfile.lab2
    container_name: lab2-site
    networks:
      - centro-network
    restart: unless-stopped
    volumes:
      - ./dados-centro:/dados-centro:ro
    environment:
      - LAB_NAME=Laboratório 2

  # Site do Laboratório 3 - Pedro rdn
  laboratorio3:
    build:
      context: ./laboratorios
      dockerfile: Dockerfile.lab3
    container_name: lab3-site
    networks:
      - centro-network
    restart: unless-stopped
    volumes:
      - ./dados-centro:/dados-centro:ro
    environment:
      - LAB_NAME=Laboratório 3

  # Site do Laboratório 4 - WendellYan-dev
  laboratorio4:
    build:
      context: ./laboratorios
      dockerfile: Dockerfile.lab4
    container_name: lab4-site
    networks:
      - centro-network
    restart: unless-stopped
    volumes:
      - ./dados-centro:/dados-centro:ro
    environment:
      - LAB_NAME=Laboratório 4

  # Proxy reverso Nginx (opcional - para centralizar acesso)
  nginx-proxy:
    image: nginx:alpine
    container_name: centro-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dados-centro:/usr/share/nginx/html/dados:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # 🔐 CERTIFICADO
    networks:
      - centro-network
    restart: unless-stopped
    depends_on:
      - laboratorio1
      - laboratorio2
      - laboratorio3
      - laboratorio4

networks:
  centro-network:
    driver: bridge
