version: "3.8"

services:
  # Site do Laboratório 1 - Camilo Feitosa
  laboratorio1:
    build:
      context: ./laboratorios
      dockerfile: Dockerfile.lab1
    container_name: lab1-site
    networks:
      - centro-network
    restart: unless-stopped
    volumes:
      - ./dados-centro:/dados-centro:ro # Acesso compartilhado aos dados do centro
    environment:
      - LAB_NAME=Laboratório 1

  # Site do Laboratório 2 - Felipe
  laboratorio2:
    build:
      context: ./laboratorios
      dockerfile: Dockerfile.lab2
    container_name: lab2-site
    networks:
      - centro-network
    restart: unless-stopped
    volumes:
      - ./dados-centro:/dados-centro:ro
    environment:
      - LAB_NAME=Laboratório 2

  # Proxy reverso Nginx (opcional - para centralizar acesso)
  nginx-proxy:
    image: nginx:alpine
    container_name: centro-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dados-centro:/usr/share/nginx/html/dados:ro
    networks:
      - centro-network
    restart: unless-stopped
    depends_on:
      - laboratorio1
      - laboratorio2

networks:
  centro-network:
    driver: bridge
