user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # =========================
    # LABORATÓRIO 1
    # Domínio Principal
    # =========================
    server {
        listen 80;
        server_name matchupsite.com.br www.matchupsite.com.br;

        location / {
            proxy_pass http://laboratorio1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # LABORATÓRIO 2
    # Seu próprio domínio
    # =========================
    server {
        listen 80;
        server_name sitelab2.com.br www.sitelab2.com.br;

        location / {
            proxy_pass http://laboratorio2:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # LABORATÓRIO 2
    # Também acessível via path
    # =========================
    server {
        listen 80;
        server_name matchupsite.com.br www.matchupsite.com.br;

        location /laboratorio2/ {
            proxy_pass http://laboratorio2:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /laboratorio2 {
            return 301 /laboratorio2/;
        }
    }

    # =========================
    # Acesso localhost e IPs para testes
    # =========================
    server {
        listen 80 default_server;
        server_name localhost ec2-3-219-150-253.compute-1.amazonaws.com _;

        # Portal principal (pode adicionar página index.html depois)
        location / {
            return 200 "Centro de Ciências Agrárias - Use /lab1 ou /lab2";
            add_header Content-Type text/plain;
        }

        location /lab1/ {
            proxy_pass http://laboratorio1:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /lab1 {
            return 301 /lab1/;
        }

        location /lab2/ {
            proxy_pass http://laboratorio2:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /lab2 {
            return 301 /lab2/;
        }

        # Dados compartilhados
        location /dados {
            alias /usr/share/nginx/html/dados;
            autoindex on;
        }
    }

    # =========================
    # FALLBACK - Comentado pois default_server está acima
    # =========================
    # server {
    #     listen 80 default_server;
    #     server_name _;
    #     return 444;
    # }
}
