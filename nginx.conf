events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Site principal do centro
    server {
        listen 80;
        server_name localhost;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Redireciona para laboratório 1
        location /lab1/ {
            proxy_pass http://laboratorio1:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Reescreve os headers para corrigir redirecionamentos
            proxy_redirect http://laboratorio1:80/ /lab1/;
            proxy_redirect / /lab1/;
        }

        # Redireciona /lab1 para /lab1/
        location = /lab1 {
            return 301 /lab1/;
        }

        # Redireciona para laboratório 2
        location /lab2/ {
            proxy_pass http://laboratorio2:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http://laboratorio2:80/ /lab2/;
            proxy_redirect / /lab2/;
        }

        location = /lab2 {
            return 301 /lab2/;
        }

        # Redireciona para laboratório 3
        location /lab3/ {
            proxy_pass http://laboratorio3:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http://laboratorio3:80/ /lab3/;
            proxy_redirect / /lab3/;
        }

        location = /lab3 {
            return 301 /lab3/;
        }

        # Dados compartilhados do centro
        location /dados {
            alias /usr/share/nginx/html/dados;
            autoindex on;
        }
    }
}
