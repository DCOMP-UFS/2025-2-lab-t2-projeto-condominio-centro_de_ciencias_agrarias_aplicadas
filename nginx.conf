user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # =========================
    # CONFIGURAÇÕES SSL GLOBAIS
    # =========================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # =========================
    # HTTP → HTTPS (matchupsite)
    # =========================
    server {
        listen 80;
        server_name matchupsite.com.br www.matchupsite.com.br;
        return 301 https://$host$request_uri;
    }

    # =========================
    # HTTPS - matchupsite.com.br
    # =========================
    server {
        listen 443 ssl;
        server_name matchupsite.com.br www.matchupsite.com.br;

        ssl_certificate /etc/letsencrypt/live/matchupsite.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matchupsite.com.br/privkey.pem;

        location / {
            proxy_pass http://laboratorio1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /laboratorio2/ {
            proxy_pass http://laboratorio2:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /laboratorio2 {
            return 301 /laboratorio2/;
        }
    }

    # =========================
    # HTTP - sitelab2 (sem SSL)
    # =========================
    server {
        listen 80;
        server_name sitelab2.com.br www.sitelab2.com.br;

        location / {
            proxy_pass http://laboratorio2:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =========================
    # HTTP - localhost / EC2
    # =========================
    server {
        listen 80 default_server;
        server_name localhost ec2-3-219-150-253.compute-1.amazonaws.com _;

        location / {
            return 200 "Centro de Ciências Agrárias - Proxy ativo";
            add_header Content-Type text/plain;
        }

        location /dados {
            alias /usr/share/nginx/html/dados;
            autoindex on;
        }

        location /lab1/ {
            proxy_pass http://laboratorio1:80/;
        }
        location = /lab1 {
            return 301 /lab1/;
        }

        location /lab2/ {
            proxy_pass http://laboratorio2:80/;
        }
        location = /lab2 {
            return 301 /lab2/;
        }

        location /lab3/ {
            proxy_pass http://laboratorio3:80/;
        }
        location = /lab3 {
            return 301 /lab3/;
        }

        location /lab4/ {
            proxy_pass http://laboratorio4:80/;
        }
        location = /lab4 {
            return 301 /lab4/;
        }

    }
}
