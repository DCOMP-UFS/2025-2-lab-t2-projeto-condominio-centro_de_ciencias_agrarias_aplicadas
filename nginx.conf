# // --- para teste de dominio
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # =========================
    # SITE 1 — LABORATÓRIO 1
    # matchupsite.com.br
    # =========================
    server {
        listen 80;
        server_name matchupsite.com.br www.matchupsite.com.br;

        location / {
            proxy_pass http://laboratorio1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # SITE 2 — LABORATÓRIO 2
    # lab2site.com.br
    # =========================
    server {
        listen 80;
        server_name lab2site.com.br www.lab2site.com.br;

        location / {
            proxy_pass http://laboratorio2:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # FALLBACK (opcional)
    # =========================
    server {
        listen 80 default_server;
        server_name _;

        return 444;
    }
}
