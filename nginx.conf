user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ...existing code...

    # =========================
    # HTTP - localhost
    # =========================
    server {
        listen 80 default_server;
        server_name localhost _;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /dados {
            alias /usr/share/nginx/html/dados;
            autoindex on;
        }

        location /lab1/ {
            proxy_pass http://laboratorio1/;
        }
        location = /lab1 {
            return 301 /lab1/;
        }

        location /lab2/ {
            proxy_pass http://laboratorio2/;
        }
        location = /lab2 {
            return 301 /lab2/;
        }

        location /lab3/ {
            proxy_pass http://laboratorio3/;
        }
        location = /lab3 {
            return 301 /lab3/;
        }

        location /lab4/ {
            proxy_pass http://laboratorio4/;
        }
        location = /lab4 {
            return 301 /lab4/;
        }
    }
}
