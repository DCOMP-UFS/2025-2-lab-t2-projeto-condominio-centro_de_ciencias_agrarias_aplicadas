user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # =========================
    # CONFIGURAÇÕES SSL GLOBAIS
    # =========================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ======================================================
    # LABORATÓRIO 1 — matchupsite.com.br
    # HTTP → HTTPS
    # ======================================================
    server {
        listen 80;
        server_name matchupsite.com.br www.matchupsite.com.br;
        return 301 https://$host$request_uri;
    }

    # ======================================================
    # LABORATÓRIO 1 — HTTPS
    # ======================================================
    server {
        listen 443 ssl;
        server_name matchupsite.com.br www.matchupsite.com.br;

        ssl_certificate /etc/letsencrypt/live/matchupsite.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matchupsite.com.br/privkey.pem;

        location / {
            proxy_pass http://laboratorio1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /laboratorio2/ {
            proxy_pass http://laboratorio2:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /laboratorio2 {
            return 301 /laboratorio2/;
        }
    }

    # ======================================================
    # LABORATÓRIO 2 — sitelab2.com.br
    # HTTP → HTTPS
    # ======================================================
    server {
        listen 80;
        server_name sitelab2.com.br www.sitelab2.com.br;
        return 301 https://$host$request_uri;
    }

    # ======================================================
    # LABORATÓRIO 2 — HTTPS
    # (ATENÇÃO: só funciona quando você tiver o certificado)
    # ======================================================
    server {
        listen 443 ssl;
        server_name sitelab2.com.br www.sitelab2.com.br;

        # ⚠️ AJUSTE ESTE CAMINHO QUANDO GERAR O CERTIFICADO
        ssl_certificate /etc/letsencrypt/live/sitelab2.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sitelab2.com.br/privkey.pem;

        location / {
            proxy_pass http://laboratorio2:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ======================================================
    # DEFAULT — localhost / IP público (HTTP → HTTPS)
    # ======================================================
    server {
        listen 80 default_server;
        server_name localhost ec2-3-219-150-253.compute-1.amazonaws.com _;
        return 301 https://$host$request_uri;
    }

    # ======================================================
    # DEFAULT — HTTPS (usa certificado do matchupsite)
    # ======================================================
    server {
        listen 443 ssl default_server;
        server_name localhost ec2-3-219-150-253.compute-1.amazonaws.com _;

        ssl_certificate /etc/letsencrypt/live/matchupsite.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matchupsite.com.br/privkey.pem;

        location / {
            return 200 "Centro de Ciências Agrárias - Use /lab1 ou /lab2";
            add_header Content-Type text/plain;
        }

        location /dados {
            alias /usr/share/nginx/html/dados;
            autoindex on;
        }

        location /lab1/ {
            proxy_pass http://laboratorio1:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /lab1 {
            return 301 /lab1/;
        }

        location /lab2/ {
            proxy_pass http://laboratorio2:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /lab2 {
            return 301 /lab2/;
        }
    }
}
