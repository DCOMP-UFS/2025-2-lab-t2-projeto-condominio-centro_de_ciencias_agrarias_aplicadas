<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Ciências Agrárias Aplicadas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
            padding: 32px;
        }

        h1 {
            color: #2e7d32;
            text-align: center;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 18px 0;
        }

        a {
            display: block;
            background: #2e7d32;
            color: #fff;
            text-decoration: none;
            padding: 16px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1em;
            transition: background 0.2s;
        }

        a:hover {
            background: #388e3c;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Centro de Ciências Agrárias Aplicadas</h1>
        <p>Bem-vindo ao portal do centro! Escolha um laboratório para acessar:</p>
        <ul>
            <li><a href="/lab1/">Laboratório 1 - Camilo</a></li>
            <li><a href="/lab2/">Laboratório 2 - Pedro</a></li>
            <li><a href="/lab3/">Laboratório 3 - Davi</a></li>
            <li><a href="/lab4/">Laboratório 4 - William</a></li>
        </ul>
        <div class="footer">&copy; 2026 Centro de Ciências Agrárias Aplicadas</div>
    </div>
</body>

</html>
